# Shared Agent Blueprints — package manifest
schema_version: 1
# Package semver lives only in ./VERSION (single source of truth).
# CLI resolves it via package_version(); do not duplicate a literal here.
version_file: VERSION
name: shared-agent-blueprints
description: Reusable multi-agent harness, prompts, templates, and blueprint profiles for Cursor, Claude Code, and AGENTS.md-compatible tools.

blueprints:
  - name: default
    path: blueprints/default
    extends: null
    description: Core memory, planning, safety, and docs harness for any repo.

  - name: engineering
    path: blueprints/engineering
    extends: default
    description: Engineering workflows — commit/review prompts and optional forge profiles.

  - name: product
    path: blueprints/product
    extends: default
    description: Product discovery — planning + PRD/ADR templates.

harness:
  entrypoint: HARNESS.md
  managed: true
  # Written into consumer state from ./VERSION at init/update time.
  version_file: VERSION
  commands:
    - start.md
    - review.md
    - commit.md
  rules:
    - safety-rules.mdc
    - task-execution.mdc
  skills:
    - context-recall
    - task-execution
    - docs-style
    - skill-creator
    - refactor-code
    - i-have-adhd
    - ponytail
    - ponytail-review
    - ponytail-audit
    - ponytail-debt
    - ponytail-gain
    - ponytail-help
    - generate-test-cases
    - update-api-docs

agents:
  entrypoint: AGENTS.md
  reference_managed_on_init_only: true

prompts:
  commands:
    - start.md
    - commit.md
    - review.md
    - pr.md
    - sync-dev.md
    - fix-comment.md
    - prerequisite.md
  reviews:
    - code-review.md
  system:
    - agent-system.md

templates:
  - entrypoints/AGENTS.md
  - entrypoints/CLAUDE.md
  - entrypoints/HARNESS.md
  - gitignore
  - memory/planning.md
  - memory/decisions.md
  - memory/run-log.md
  - memory/hotcache.md
  - memory/anti-patterns.md
  - memory/learning.md
  - prd.md
  - adr.md
  - review-checklist.md

compatibility:
  preserve_existing_agents: true
  preserve_existing_claude: true
  # Paths written into consuming projects (not stored as live runtime in this package).
  consumer_install_targets:
    - HARNESS.md
    - AGENTS.md
    - CLAUDE.md
    - .cursor/commands
    - .cursor/skills
    - .cursor/rules
    - .cursor/templates
    - .claude/commands
    - .claude/skills
    - .claude/rules
    - .claude/templates
    - .agents/commands
    - .agents/skills
    - .agents/rules
    - .agents/templates
  docs_root: docs/
  runtime_roots:
    - .cursor
    - .claude
    - .agents
  source_root: harness
  entrypoints_root: templates/entrypoints
  managed_marker: "<!-- managed-by: shared-agent-blueprints -->"
  harness_reference_markers:
    start: "<!-- BLUEPRINT:HARNESS:START -->"
    end: "<!-- BLUEPRINT:HARNESS:END -->"
  package_must_not_contain:
    - .cursor/
    - .claude/
    - .agents/
    - PLANNING.md
    - DECISIONS.md
    - RUN_LOG.md
    - HOTCACHE.md
    - LEARNING.md
    - ANTI-PATTERNS.md
    - .agent-blueprint.yaml
  local_override_files:
    - .agent-blueprint.local.yaml
    - AGENTS.local.md
    - CLAUDE.local.md

install:
  conflict_policy: preserve-local
  default_runtime: prompt
  copy_memory_templates_to_root: true
  source_cache: "${XDG_CACHE_HOME:-$HOME/.cache}/blueprint/repos"
  history: "${XDG_DATA_HOME:-$HOME/.local/share}/blueprint/history.jsonl"
  do_not_overwrite:
    - PLANNING.md
    - DECISIONS.md
    - RUN_LOG.md
    - HOTCACHE.md
    - LEARNING.md
    - ANTI-PATTERNS.md
    - ARCHITECTURE.md
    - .gitignore
    - AGENTS.md
    - agents.md
    - CLAUDE.md
    - claude.md
